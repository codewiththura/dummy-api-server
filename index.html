<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      .highlight {
        color: #0070f3;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Where to Start Coding?</h1>
    <button id="actionBtn">Click</button>

    <script>
      const btn = document.getElementById("actionBtn");
      const title = document.getElementById("title");

      btn.addEventListener("click", () => {
        title.innerText = "Start with HTML, then CSS, then JavaScript!";
        title.className = "highlight";
      });
    </script>
  </body>
</html>
