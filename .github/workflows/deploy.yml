name: Build, Test, and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute test suite
        run: npm test

  build-and-push:
    name: Build & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Social App API Server
            org.opencontainers.image.description=Mock API Server for Mobile and Frontend Development Testing

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: SSH into VPS and Update Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
            
            echo "🚀 Pulling latest Docker image from GHCR..."
            docker pull $IMAGE_NAME
            
            echo "🛑 Stopping and removing previous container..."
            docker stop social-app-api-container 2>/dev/null || true
            docker rm social-app-api-container 2>/dev/null || true
            
            echo "📁 Ensuring persistent uploads directory on host..."
            mkdir -p ~/social-app/uploads/users ~/social-app/uploads/posts
            
            echo "▶️ Launching updated container..."
            docker run -d \
              --name social-app-api-container \
              -p 5000:5000 \
              -v ~/social-app/uploads:/usr/src/app/uploads \
              --restart unless-stopped \
              $IMAGE_NAME
            
            echo "🧹 Pruning old unused images..."
            docker image prune -f
            
            echo "✅ Deployment successful! Active container:"
            docker ps --filter "name=social-app-api-container"

